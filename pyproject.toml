[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "private-devtools-thumbnail-service"
version = "0.1.0"
description = "A typed Python service that resizes developer-tool images and stores release thumbnails."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<12",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
devtools-image-service = "devtools_image_service:run"

[tool.setuptools]
py-modules = ["devtools_image_service", "infrai_storage", "release_thumbnail"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
